- name: Install Docker and Compose tools
  hosts: all
  become: yes
  tasks:
    - name: update and upgrade apt packages
      apt:
        update_cache: yes
        upgrade: dist

    - name: Install required system packages
      apt:
        pkg:
          - apt-transport-https
          - ca-certificates
          - curl
          - python3-pip
          - virtualenv
          - python3-setuptools
        state: latest
        update_cache: true

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /usr/share/keyrings/docker-archive-keyring.gpg
        mode: '0644'

    - name: Add Docker repository with signed-by option
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu jammy stable"
        state: present
        filename: docker

    - name: Update apt and install docker-ce
      apt:
        name: docker-ce
        state: latest
        update_cache: true
    - name: Ensure Docker CLI plugins directory exists
      file:
        path: /usr/lib/docker/cli-plugins
        state: directory
        mode: '0755'

    - name: Install docker-compose plugin (Compose v2)
      get_url:
        url: https://github.com/docker/compose/releases/download/v2.29.2/docker-compose-linux-x86_64
        dest: /usr/lib/docker/cli-plugins/docker-compose
        mode: '0755'
    - name : create Folder for the project
      file:
        path: /home/anas/inception
        state: directory
        recurse: yes
    - name : create Data for db
      file:
        path: /home/anas/data/mariadb
        state: directory
        recurse: yes
    - name : create Data for wordpress
      file:
        path: /home/anas/data/wordpress
        state: directory
        recurse: yes
    - name : copy data to remote server
      copy :
        src: ./inception/
        dest: /home/anas/inception
    - name : cd inception and run make
      command: make
      args:
        chdir: /home/anas/inception