---
- name: Create project folder
  file:
    path: "{{ ansible_env.HOME }}/inception"
    state: directory
    owner: "{{ ansible_env.USER }}"
    group: "{{ ansible_env.USER }}"
    mode: '0755'

- name: Create data folder 
  file:
    path: "{{ ansible_env.HOME }}/data"
    state: directory
    mode: '0755'

- name: Create data folder for MariaDB
  file:
    path: "{{ ansible_env.HOME }}/data/mariadb"
    state: directory
    mode: '0755'

- name: Create data folder for WordPress
  file:
    path: "{{ ansible_env.HOME }}/data/wordpress"
    state: directory
    mode: '0755'